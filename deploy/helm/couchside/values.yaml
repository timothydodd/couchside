image:
  repository: ghcr.io/timothydodd/couchside
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Extra pod metadata (a log agent, a backup operator). Don't set
# app.kubernetes.io/name or /instance in podLabels: the selector uses them.
podAnnotations: {}
podLabels: {}
# Keeps the server (and its recordings) ahead of batch pods when the node is
# short of resources; "" uses the cluster's default.
priorityClassName: ""

# TMDB (The Movie Database) is the main metadata source: titles, plots,
# posters, backdrops and episode names. Release images carry Couchside's own
# key, so it works with nothing set. To use your own key instead, put it in a
# Secret and name it here; enabled: false turns TMDB off.
tmdb:
  enabled: true
  existingSecret: ""
  existingSecretKey: tmdb-api-key

# OMDb API key (free at https://www.omdbapi.com/apikey.aspx): an optional
# second source for titles TMDB can't place. Its data is CC BY-NC: not for
# commercial use.
# Prefer existingSecret so the key never lands in a values file.
omdb:
  apiKey: ""
  existingSecret: ""
  existingSecretKey: omdb-api-key

# Accounts are always on. enabled: true requires passwords (no passwordless
# sign-in, where picking a profile signs in): set it before exposing Couchside
# to the internet. With no admin password yet, the pod log prints a one-time
# setup code; open the UI and enter it to create the first admin. Lost the
# admin password?
#   kubectl exec -it deploy/couchside -- couchside reset-password -admin <name>
auth:
  enabled: false
  # An Ingress puts Couchside where people outside your home may reach it, so
  # the chart refuses ingress.enabled=true unless auth.enabled is true too.
  # For an ingress only your LAN can reach, allowOpenIngress: true keeps
  # passwordless sign-in.
  allowOpenIngress: false
  # Reverse proxies whose X-Forwarded-For / X-Forwarded-Proto Couchside
  # believes (CIDRs or addresses). Behind the ingress, that's the ingress
  # controller's pods: on k3s with Traefik, the pod network, 10.42.0.0/16.
  # Empty trusts nobody: sign-in throttling then sees the proxy's address.
  trustedProxies: []

# Time zone for guide times and recording file names (a tz database name).
timezone: ""            # e.g. America/New_York; "" leaves the image's UTC

# Live TV and DVR need an HDHomeRun on your network.
livetv:
  hdhomerun: ""         # tuner IP or host; "" turns Live TV's tuner off

# Extra environment variables for settings the chart has no value for, e.g.
# COUCHSIDE_DVR_PAD_AFTER or COUCHSIDE_COMSKIP_INI (see docs/configuration.md).
extraEnv: []
#  - name: COUCHSIDE_DVR_PAD_AFTER
#    value: 2m

# Extra volumes and where to mount them, e.g. a ConfigMap holding your own
# comskip.ini (then point COUCHSIDE_COMSKIP_INI at it with extraEnv).
extraVolumes: []
#  - name: comskip
#    configMap:
#      name: couchside-comskip
extraVolumeMounts: []
#  - name: comskip
#    mountPath: /config/comskip
#    readOnly: true

# LAN discovery: TV apps find the server with an SSDP search instead of
# having its address typed in. Multicast from the LAN only reaches a pod on
# the host's network, so it does nothing unless hostNetwork is true (the pod
# then also listens on the node's port 8080 directly).
discovery:
  enabled: true
  hostNetwork: false
  serverName: ""        # shown in TV apps; "" = the node's host name with hostNetwork
  url: ""               # base URL to advertise when the LAN reaches Couchside elsewhere (an ingress, a NodePort)

config:
  workers: 2            # concurrent scan/match/thumbnail jobs
  scanInterval: 6h      # "0" disables periodic rescans
  debug: false
  maxTranscodes: 2      # live transcode sessions at once
  encodeWorkers: 1      # background "optimize" encodes at once
  optimizeHeight: 1080

# Hardware transcoding. vaapi = an Intel or AMD GPU through /dev/dri (Intel's
# drivers are in the image). The stock image's ffmpeg has no NVENC or Quick
# Sync: for those, build an image whose ffmpeg has them and set
# image.repository; mode is passed straight through as COUCHSIDE_HWACCEL.
# Anything unusable falls back to software with a warning in the log.
hwaccel:
  mode: none            # none | vaapi
  # The VAAPI render node, when the node has more than one GPU
  # (COUCHSIDE_VAAPI_DEVICE); "" uses /dev/dri/renderD128.
  device: ""
  dri:
    # How the pod gets the GPU. Pick one:
    #  - resource: a device plugin hands it to an unprivileged pod. Intel's
    #    (github.com/intel/intel-device-plugins-for-kubernetes): gpu.intel.com/i915;
    #    generic-device-plugin with a "dri" device: squat.ai/dri.
    #  - enabled + privileged: /dev/dri mounted from the node. containerd only
    #    lets a privileged container open it, which turns off most of the
    #    pod's hardening (it still runs as 1000:1000). The last resort.
    resource: ""        # e.g. gpu.intel.com/i915
    resourceCount: 1
    enabled: false      # mount /dev/dri from the node (needs privileged: true)
    privileged: false
    # Host gids owning /dev/dri/renderD128 and card* (ls -ln /dev/dri on the
    # node), so the unprivileged user can open the device either way.
    groups: []

# Where your media lives, mounted at /media; libraries are added in the UI as
# folders under /media (e.g. /media/Movies).
media:
  type: nfs             # nfs | hostPath | pvc
  mountPath: /media
  # Read-only keeps Couchside from changing your files. Set false to let the
  # DVR record into a TV library folder, or to delete files from a library's
  # Manage view; those fail on a read-only mount.
  readOnly: true
  nfs:
    server: 192.168.1.10
    path: /volume1/media
  hostPath:
    path: /mnt/media    # pin the pod with nodeSelector when using hostPath
  pvc:
    claimName: ""

persistence:
  # SQLite database. Small, but back it up.
  data:
    size: 1Gi
    storageClass: ""    # "" = cluster default (local-path on k3s)
    existingClaim: ""
  # Artwork, stills, subtitles, preview thumbnails, optimized copies and
  # live TV segments. 20Gi suits a mid-size library; optimized copies are
  # full MP4s (a few GB each), so size it for how much you optimize.
  cache:
    size: 20Gi
    storageClass: ""
    existingClaim: ""
  # The DVR's default recordings folder (/recordings). Without it, recordings
  # land in the container and are lost when the pod restarts, unless Settings
  # points the DVR at a folder under a writable /media.
  recordings:
    enabled: false
    size: 200Gi
    storageClass: ""
    existingClaim: ""

service:
  type: ClusterIP        # ClusterIP | NodePort | LoadBalancer
  port: 8080
  # With type NodePort: a fixed port (30000-32767), so TV apps keep the same
  # address; "" lets Kubernetes pick.
  nodePort: ""

ingress:
  enabled: false
  className: traefik
  host: couchside.home.lan
  annotations: {}
  tls:
    enabled: false
    secretName: couchside-tls
    clusterIssuer: ""   # e.g. letsencrypt; adds the cert-manager annotation

# A soft limit for the server's own Go heap (GOMEMLIMIT): near it the garbage
# collector works harder and hands memory back, leaving room under the pod's
# limit for ffmpeg and comskip, which aren't counted. "" leaves it unset.
goMemLimit: 1GiB

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    # Covers the server and every ffmpeg and comskip it runs. A software 4K
    # transcode alone can take 1-2 GB; at the limit the whole pod is
    # OOM-killed, recordings in progress included.
    memory: 4Gi

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  # Only fix ownership when the volume's root is wrong, instead of walking
  # the cache and recordings volumes on every start.
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
# The container drops every capability and can't gain privileges (the image
# runs as 1000:1000). With hwaccel.dri.privileged it is privileged (to open
# /dev/dri from the node) but still runs as 1000:1000 with no capabilities asked for.

# Mount the container's root filesystem read-only. /tmp (and /recordings when
# it isn't persisted) become emptyDir volumes.
readOnlyRootFilesystem: false

# Liveness only starts once the server has answered. Hardware detection and
# database migrations run before it listens, so allow a few minutes. The
# startup and readiness probes ask the database (/healthz); liveness only asks
# whether the process answers (/livez).
startupProbe:
  periodSeconds: 5
  failureThreshold: 60

# How long a stopping pod has to finish requests, leave its job for the next
# start and close the database. A recording in progress is cut either way and
# resumed by the next pod.
terminationGracePeriodSeconds: 60

nodeSelector: {}
tolerations: []
affinity: {}
