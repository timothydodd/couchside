{{- if and .Values.hwaccel.dri.enabled (not .Values.hwaccel.dri.privileged) }}
{{- fail "hwaccel.dri.enabled mounts /dev/dri from the node, which containerd only lets a privileged container open: set hwaccel.dri.privileged=true, or use a GPU device plugin instead (hwaccel.dri.resource=gpu.intel.com/i915) with dri.enabled=false." }}
{{- end }}
{{- if and .Values.hwaccel.dri.enabled .Values.hwaccel.dri.resource }}
{{- fail "set hwaccel.dri.enabled (mount /dev/dri) or hwaccel.dri.resource (a device plugin), not both" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "couchside.fullname" . }}
  labels: {{- include "couchside.labels" . | nindent 4 }}
spec:
  replicas: 1
  # SQLite on a ReadWriteOnce volume: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "couchside.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "couchside.selector" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      # Couchside never talks to the Kubernetes API.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.discovery.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $psc := deepCopy (.Values.podSecurityContext | default dict) }}
      {{- with .Values.hwaccel.dri.groups }}
      {{- $_ := set $psc "supplementalGroups" . }}
      {{- end }}
      {{- with $psc }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: couchside
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            {{- if and .Values.hwaccel.dri.enabled .Values.hwaccel.dri.privileged }}
            {{- /* /dev/dri from the node: containerd needs privileged. It still runs as 1000:1000. */}}
            privileged: true
            {{- else }}
            {{- /* No GPU, or a GPU through a device plugin: unprivileged. */}}
            allowPrivilegeEscalation: false
            {{- end }}
            {{- if .Values.readOnlyRootFilesystem }}
            readOnlyRootFilesystem: true
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: COUCHSIDE_MEDIA_ROOT
              value: {{ .Values.media.mountPath | quote }}
            - name: COUCHSIDE_WORKERS
              value: {{ .Values.config.workers | quote }}
            - name: COUCHSIDE_SCAN_INTERVAL
              value: {{ .Values.config.scanInterval | quote }}
            - name: COUCHSIDE_HWACCEL
              value: {{ .Values.hwaccel.mode | quote }}
            {{- with .Values.hwaccel.device }}
            - name: COUCHSIDE_VAAPI_DEVICE
              value: {{ . | quote }}
            {{- end }}
            - name: COUCHSIDE_MAX_TRANSCODES
              value: {{ .Values.config.maxTranscodes | quote }}
            - name: COUCHSIDE_ENCODE_WORKERS
              value: {{ .Values.config.encodeWorkers | quote }}
            - name: COUCHSIDE_OPTIMIZE_HEIGHT
              value: {{ .Values.config.optimizeHeight | quote }}
            {{- with .Values.goMemLimit }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: COUCHSIDE_AUTH
              value: "true"
            {{- end }}
            {{- with .Values.auth.trustedProxies }}
            - name: COUCHSIDE_TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.livetv.hdhomerun }}
            - name: COUCHSIDE_HDHOMERUN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.timezone }}
            - name: TZ
              value: {{ . | quote }}
            {{- end }}
            {{- if not .Values.discovery.enabled }}
            - name: COUCHSIDE_DISCOVERY
              value: "false"
            {{- end }}
            {{- with .Values.discovery.serverName }}
            - name: COUCHSIDE_SERVER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.discovery.url }}
            - name: COUCHSIDE_DISCOVERY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.config.debug }}
            - name: COUCHSIDE_DEBUG
              value: "1"
            {{- end }}
            {{- if not .Values.tmdb.enabled }}
            - name: TMDB_API_KEY
              value: "off"
            {{- else if .Values.tmdb.existingSecret }}
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tmdb.existingSecret }}
                  key: {{ .Values.tmdb.existingSecretKey }}
            {{- end }}
            {{- if or .Values.omdb.apiKey .Values.omdb.existingSecret }}
            - name: OMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "couchside.omdbSecret" . }}
                  key: {{ .Values.omdb.existingSecretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: {{ .Values.media.mountPath }}
              readOnly: {{ .Values.media.readOnly }}
            {{- if .Values.persistence.recordings.enabled }}
            - name: recordings
              mountPath: /recordings
            {{- end }}
            {{- if .Values.hwaccel.dri.enabled }}
            - name: dri
              mountPath: /dev/dri
            {{- end }}
            {{- if .Values.readOnlyRootFilesystem }}
            - name: tmp
              mountPath: /tmp
            {{- if not .Values.persistence.recordings.enabled }}
            - name: recordings-scratch
              mountPath: /recordings
            {{- end }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # /healthz asks the database; /livez only that the process answers,
          # so a busy database (a scan, a backup) never gets the pod killed.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          {{- $res := deepCopy (.Values.resources | default dict) }}
          {{- if .Values.hwaccel.dri.resource }}
          {{- $limits := deepCopy ($res.limits | default dict) }}
          {{- $_ := set $limits .Values.hwaccel.dri.resource (.Values.hwaccel.dri.resourceCount | int) }}
          {{- $_ := set $res "limits" $limits }}
          {{- end }}
          resources: {{- toYaml $res | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.existingClaim | default (printf "%s-data" (include "couchside.fullname" .)) }}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.cache.existingClaim | default (printf "%s-cache" (include "couchside.fullname" .)) }}
        - name: media
          {{- if eq .Values.media.type "nfs" }}
          nfs:
            server: {{ required "media.nfs.server is required" .Values.media.nfs.server }}
            path: {{ required "media.nfs.path is required" .Values.media.nfs.path }}
            readOnly: {{ .Values.media.readOnly }}
          {{- else if eq .Values.media.type "hostPath" }}
          hostPath:
            path: {{ required "media.hostPath.path is required" .Values.media.hostPath.path }}
            type: Directory
          {{- else if eq .Values.media.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ required "media.pvc.claimName is required" .Values.media.pvc.claimName }}
            readOnly: {{ .Values.media.readOnly }}
          {{- else }}
          {{- fail "media.type must be nfs, hostPath or pvc" }}
          {{- end }}
        {{- if .Values.persistence.recordings.enabled }}
        - name: recordings
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.recordings.existingClaim | default (printf "%s-recordings" (include "couchside.fullname" .)) }}
        {{- end }}
        {{- if .Values.hwaccel.dri.enabled }}
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        {{- end }}
        {{- if .Values.readOnlyRootFilesystem }}
        - name: tmp
          emptyDir: {}
        {{- if not .Values.persistence.recordings.enabled }}
        - name: recordings-scratch
          emptyDir: {}
        {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
