# Couchside with media on this machine's disk.
#   1. put your media in ./media next to this file (create the folder first,
#      or Docker makes it as root), or set MEDIA_PATH in .env
#   2. optional: copy .env.example to .env for the time zone, HDHomeRun, keys
#   3. docker compose up -d
#   4. open http://localhost:8080 and add a library (/media/Movies, "/media/TV Shows")
#
# Media on a NAS share instead: docker-compose.smb.yml.
# To build from this checkout: add -f docker-compose.dev.yml and --build.
services:
  couchside:
    # A release (COUCHSIDE_VERSION=0.19.0 in .env) pins the version; latest follows releases.
    image: ghcr.io/timothydodd/couchside:${COUCHSIDE_VERSION:-latest}
    container_name: couchside
    ports:
      - "8080:8080"
    # For TV apps to find the server on the LAN (SSDP), replace "ports" with:
    # network_mode: host
    environment:
      # Metadata: release images have a built-in TMDB key. Set TMDB_API_KEY to
      # use your own ("off" disables TMDB); OMDB_API_KEY adds a fallback.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      # Intel/AMD GPU on a Linux host: vaapi, and uncomment devices below.
      COUCHSIDE_HWACCEL: ${COUCHSIDE_HWACCEL:-none}
      # Live TV + DVR: your HDHomeRun's IP. Empty turns Live TV off.
      COUCHSIDE_HDHOMERUN: ${HDHOMERUN:-}
      # "true" requires passwords (no passwordless sign-in): for a server on the
      # internet. The first start then prints a setup code (docker compose logs).
      COUCHSIDE_AUTH: ${COUCHSIDE_AUTH:-false}
      # Guide times and recording file names use this time zone; empty = UTC.
      TZ: ${TZ:-}
    # devices:
    #   - /dev/dri:/dev/dri
    volumes:
      - data:/data
      - cache:/cache
      - recordings:/recordings
      # Your media. Add :ro to keep Couchside from writing to it (the DVR then
      # records to /recordings only, and deleting from Manage is off).
      - ${MEDIA_PATH:-./media}:/media
    restart: unless-stopped

volumes:
  data:
  cache:
  recordings:
