name: docker

# Builds the image (amd64 only, nothing pushed) when the Dockerfile or what it
# copies in changes, so a base-image or Comskip bump is caught before a release.
on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, .github/workflows/docker.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, .github/workflows/docker.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
