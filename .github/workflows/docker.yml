name: docker

# Builds the image (amd64 only, nothing pushed) when the Dockerfile or the
# dependencies it installs change, so a base-image, Comskip or lockfile bump
# is caught before a release.
on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, .github/workflows/docker.yml, web/package-lock.json, server/go.sum]
  pull_request:
    paths: [Dockerfile, .dockerignore, .github/workflows/docker.yml, web/package-lock.json, server/go.sum]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: couchside:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Known vulnerabilities in the image's packages (Alpine, ffmpeg's
      # libraries, comskip's). Reported, not failing the build: most need a
      # base-image bump from Dependabot.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: couchside:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
