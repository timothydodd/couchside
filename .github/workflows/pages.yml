name: pages

# Publishes site/ to https://couchside.app with GitHub Pages. The custom
# domain is set in the repo's Pages settings (CNAME is kept for reference).
on:
  push:
    branches: [main]
    paths: ["site/**", "web/public/icons/**", "web/public/favicon.ico", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assemble the site
        run: |
          mkdir -p _site/icons
          cp -r site/. _site/
          cp web/public/icons/logo-32.png web/public/icons/logo-256.png web/public/icons/logo-512.png _site/icons/
          cp web/public/favicon.ico web/public/apple-touch-icon.png _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
