name: release

# Push a tag like v0.2.0 to publish:
#  - zips for Linux, macOS and Windows (single binary with the web UI embedded)
#  - the Windows installer (windows-installer.yml: service, ffmpeg included)
#  - a GitHub Release with those and SHA-256 checksums
#  - a multi-arch container: ghcr.io/<owner>/couchside:v<version>, :<version>, :<major>.<minor>, :latest
#  - the Helm chart: oci://ghcr.io/<owner>/charts/couchside, version <version> (the
#    package must be made public once on GitHub, or installing it needs a login)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v0.2.0-test); publishes nothing but workflow artifacts"
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  # The Helm chart installs .Chart.AppVersion by default, so it must name this release.
  chart-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the whole history, to check the tag is on main
      - name: Chart version and appVersion match the tag
        if: github.event_name == 'push'
        run: |
          for field in appVersion version; do
            got=$(sed -n "s/^${field}: *\"\{0,1\}\([^\" ]*\)\"\{0,1\}.*/\1/p" deploy/helm/couchside/Chart.yaml)
            [ "$got" = "${VERSION#v}" ] || { echo "::error file=deploy/helm/couchside/Chart.yaml::${field} is $got; set version and appVersion to ${VERSION#v} before tagging"; exit 1; }
          done
      - name: The tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::${VERSION} isn't on main; releases are cut from main"; exit 1; }

  # Nothing is built or published from a commit that doesn't pass CI's checks.
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27" # the Dockerfile's
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # A release ships the notices file as it is in the repo: it must match
      # the dependencies being built. (Only license files are read, so no
      # install scripts need to run.)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26 # the Dockerfile's
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: web
      - name: Third-party notices are current
        working-directory: .
        run: python3 scripts/third-party-notices.py --check

  web:
    needs: [chart-version, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26 # the Dockerfile's
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  binaries:
    needs: web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27" # the Dockerfile's
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: server/internal/webui/dist
      - name: build
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Couchside's own TMDB key (repo secret), built in so metadata works with no setup.
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X github.com/timothydodd/couchside/internal/config.builtinTMDBKey=${TMDB_KEY}" \
            -o "../dist/couchside${ext}" ./cmd/couchside
      - name: package
        run: |
          name="couchside-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "pkg/${name}"
          cp dist/* README.md LICENSE THIRD_PARTY_NOTICES.txt "pkg/${name}/"
          mkdir -p "pkg/${name}/docs" && cp docs/install.md docs/configuration.md "pkg/${name}/docs/"
          cat > "pkg/${name}/QUICKSTART.txt" <<'TXT'
          Couchside needs ffmpeg and ffprobe on the PATH (or set COUCHSIDE_FFMPEG / COUCHSIDE_FFPROBE).

            COUCHSIDE_MEDIA_ROOT=/path/to/media ./couchside      (Windows: couchside.exe)

          Then open http://localhost:8080 and add a library on the Libraries page.
          Optional: COUCHSIDE_HDHOMERUN=<tuner IP> for Live TV. Movie and TV details come from TMDB with no setup.
          All settings are in docs/configuration.md.
          TXT
          (cd pkg && zip -qr "../${name}.zip" "${name}")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zip-${{ matrix.goos }}-${{ matrix.goarch }}
          path: couchside-*.zip
          retention-days: 7

  installer:
    needs: web
    uses: ./.github/workflows/windows-installer.yml
    permissions:
      contents: read
      id-token: write # Azure sign-in for code signing
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    secrets: inherit

  container:
    # The image builds its own web UI, so it waits for that build to pass too.
    needs: [chart-version, verify, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          build-args: VERSION=${{ env.VERSION }}
          secrets: |
            tmdb_key=${{ secrets.TMDB_API_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The chart is pushed only once the image it installs is published.
  chart:
    if: github.event_name == 'push'
    needs: [chart-version, verify, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: package and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm lint deploy/helm/couchside --set media.type=hostPath --set media.hostPath.path=/media
          helm package deploy/helm/couchside --destination chart-out
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "chart-out/couchside-${VERSION#v}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

  release:
    if: github.event_name == 'push'
    # installer fails on a v* tag that can't be signed (windows-installer.yml),
    # so nothing unsigned is published.
    needs: [binaries, installer, container, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: zip-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-installer
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-exe
          path: signed
      # The Windows zip was cross-built on Linux, unsigned: put the installer
      # job's signed couchside.exe in its place before anything is hashed.
      - name: signed exe in the Windows zip
        run: |
          zip=$(ls couchside-*-windows-amd64.zip)
          dir=${zip%.zip}
          mkdir -p "swap/$dir" && cp signed/couchside.exe "swap/$dir/couchside.exe"
          (cd swap && zip -q "../$zip" "$dir/couchside.exe")
          unzip -l "$zip" | grep -q "$dir/couchside.exe"
      - name: checksums
        run: sha256sum couchside-*.zip couchside-*.exe > SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            couchside-*.zip
            couchside-*.exe
            SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            **Container:** `docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}`

            **Helm chart:** `helm install couchside oci://ghcr.io/${{ github.repository_owner }}/charts/couchside --version <this release without the v>` (docs/install.md has the values).

            **Windows installer** (`couchside-*-windows-amd64-setup.exe`) installs Couchside as a Windows service with ffmpeg included and picks your GPU encoder (NVIDIA or Intel) by itself. The installer and every `couchside.exe` (the installer's and the Windows zip's) are code-signed.

            **Zips** hold a single `couchside` binary with the web UI built in. It needs `ffmpeg` and `ffprobe` installed; see QUICKSTART.txt inside.
