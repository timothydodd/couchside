name: release

# Push a tag like v0.2.0 to publish:
#  - zips for Linux, macOS and Windows (single binary with the web UI embedded)
#  - a GitHub Release with those zips and SHA-256 checksums
#  - a multi-arch container: ghcr.io/<owner>/couchside:v<version>, :<version>, :<major>.<minor>, :latest
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v0.2.0-test); publishes nothing but workflow artifacts"
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  binaries:
    needs: web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/internal/webui/dist
      - name: build
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Couchside's own TMDB key (repo secret), built in so metadata works with no setup.
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X github.com/timothydodd/couchside/internal/config.builtinTMDBKey=${TMDB_KEY}" \
            -o "../dist/couchside${ext}" ./cmd/couchside
      - name: package
        run: |
          name="couchside-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "pkg/${name}"
          cp dist/* README.md .env.example docker-compose.yml "pkg/${name}/"
          cat > "pkg/${name}/QUICKSTART.txt" <<'TXT'
          Couchside needs ffmpeg and ffprobe on the PATH (or set COUCHSIDE_FFMPEG / COUCHSIDE_FFPROBE).

            COUCHSIDE_MEDIA_ROOT=/path/to/media ./couchside      (Windows: couchside.exe)

          Then open http://localhost:8080 and add a library on the Libraries page.
          Optional: OMDB_API_KEY for posters and plots, COUCHSIDE_HDHOMERUN=<tuner IP> for Live TV.
          All settings are in README.md under Configuration.
          TXT
          (cd pkg && zip -qr "../${name}.zip" "${name}")
      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.goos }}-${{ matrix.goarch }}
          path: couchside-*.zip
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          build-args: VERSION=${{ env.VERSION }}
          secrets: |
            tmdb_key=${{ secrets.TMDB_API_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.event_name == 'push'
    needs: [binaries, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true
      - name: checksums
        run: sha256sum couchside-*.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            couchside-*.zip
            SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            **Container:** `docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}`

            **Zips** hold a single `couchside` binary with the web UI built in. It needs `ffmpeg` and `ffprobe` installed; see QUICKSTART.txt inside.
