name: windows-installer

# Builds the Windows installer (deploy/windows/couchside.iss): couchside.exe
# with the web UI embedded, the pinned ffmpeg beside it, and the Inno Setup
# wizard that installs the "Couchside" service. Called by release.yml and
# prerelease.yml after their web job has uploaded web-dist; uploads the
# windows-installer artifact.
#
# Signing (Azure Artifact Signing): couchside.exe and the installer are signed
# when the run is for a tag and these are set. Azure trusts only jobs in the
# 'release' environment (the federated credential's subject), which admits v*
# and pre-* tags and waits for timothydodd to approve the run (Actions →
# Review deployments); manual runs get no environment and stay unsigned.
# A v* tag fails here when signing isn't configured, so release.yml can't
# publish an unsigned exe; pre-* tags and manual runs build unsigned with a
# warning. The signed couchside.exe is also uploaded (windows-exe) for the
# release's Windows zip.
#   secrets (release environment): AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   variables: SIGNING_ENDPOINT, SIGNING_ACCOUNT, SIGNING_PROFILE
# jellyfin's ffmpeg.exe and ffprobe.exe are shipped as they come.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  # jellyfin-ffmpeg: its NVENC runs on older NVIDIA drivers than upstream
  # builds (Gyan's 8.1+ need 610+), and it has Quick Sync and CUDA filters.
  # GPL: FFMPEG.txt in the install folder says where the source is.
  FFMPEG_VERSION: 8.1.3-1
  FFMPEG_SHA256: 3691f8b2d4c39c511b5faff1c8c4687bd782dac823e63ba69f0755f7ce1af9ce
  INNO_VERSION: 6.7.3
  INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732

jobs:
  installer:
    runs-on: windows-latest
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    env:
      SIGN: ${{ github.ref_type == 'tag' && secrets.AZURE_CLIENT_ID != '' && vars.SIGNING_ACCOUNT != '' && vars.SIGNING_PROFILE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27" # the Dockerfile's
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: server/internal/webui/dist
      - name: build couchside.exe
        shell: bash
        working-directory: server
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.version }}
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X github.com/timothydodd/couchside/internal/config.builtinTMDBKey=${TMDB_KEY}" \
            -o ../sign/couchside.exe ./cmd/couchside
      - name: a v* release must be signed
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && env.SIGN != 'true'
        shell: bash
        run: |
          echo "::error::${{ github.ref_name }} is a release tag but code signing isn't configured (the AZURE_CLIENT_ID secret and the SIGNING_ACCOUNT / SIGNING_PROFILE variables on the release environment). Releases never ship unsigned exes."
          exit 1
      - name: unsigned build (not a v* tag)
        if: env.SIGN != 'true'
        shell: bash
        run: echo "::warning::Signing is off for this run, so couchside.exe and the installer are unsigned. That's fine for pre-* tags and manual runs only."
      - name: Azure login (code signing)
        if: env.SIGN == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Built into its own folder so only our exe is signed, not ffmpeg's.
      - name: sign couchside.exe
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0.5.11
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: sign
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: verify couchside.exe signature
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature sign/couchside.exe
          if ($sig.Status -ne 'Valid') { throw "couchside.exe signature is $($sig.Status): $($sig.StatusMessage)" }
          if (-not $sig.TimeStamperCertificate) { throw "couchside.exe signature has no timestamp" }
          Write-Host "couchside.exe signed by $($sig.SignerCertificate.Subject), timestamped by $($sig.TimeStamperCertificate.Subject)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-exe
          path: sign/couchside.exe
          retention-days: 14
      - name: stage couchside.exe
        shell: bash
        run: mkdir -p stage && cp sign/couchside.exe stage/
      - name: ffmpeg
        shell: pwsh
        run: |
          $v = $env:FFMPEG_VERSION
          Invoke-WebRequest "https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v$v/jellyfin-ffmpeg_${v}_portable_win64-clang-gpl.zip" -OutFile ffmpeg.zip
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash -ne $env:FFMPEG_SHA256) { throw "ffmpeg.zip doesn't match FFMPEG_SHA256" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Copy-Item ffmpeg/ffmpeg.exe, ffmpeg/ffprobe.exe stage/
          # The encoders and filters Couchside relies on.
          $enc = stage/ffmpeg.exe -hide_banner -encoders | Out-String
          $flt = stage/ffmpeg.exe -hide_banner -filters | Out-String
          foreach ($n in 'h264_nvenc', 'h264_qsv', 'libx264') { if ($enc -notmatch " $n ") { throw "ffmpeg has no $n" } }
          foreach ($n in 'zscale', 'tonemap', 'scale2ref', 'yadif') { if ($flt -notmatch " $n ") { throw "ffmpeg has no $n filter" } }
          @"
          ffmpeg.exe and ffprobe.exe are jellyfin-ffmpeg $v (portable win64 GPL build),
          licensed under the GNU General Public License version 3.

          Release: https://github.com/jellyfin/jellyfin-ffmpeg/releases/tag/v$v
          Source:  https://github.com/jellyfin/jellyfin-ffmpeg/tree/v$v
          "@ | Set-Content stage/FFMPEG.txt
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.txt stage/
      - name: Inno Setup
        shell: pwsh
        run: |
          $v = $env:INNO_VERSION
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-$($v -replace '\.', '_')/innosetup-$v.exe" -OutFile is.exe
          if ((Get-FileHash is.exe -Algorithm SHA256).Hash -ne $env:INNO_SHA256) { throw "innosetup doesn't match INNO_SHA256" }
          Start-Process ./is.exe -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/PORTABLE=1', '/CURRENTUSER', '/NOICONS', "/DIR=$PWD\inno"
      - name: installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Windows file versions are numbers only: v0.13.0 and pre-0.13.0-1 are both 0.13.0.
          $num = if ($env:VERSION -match '\d+\.\d+\.\d+') { $Matches[0] } else { '0.0.0' }
          ./inno/ISCC.exe /Q "/DAppVersion=$env:VERSION" "/DNumVersion=$num" "/DStage=$PWD\stage" "/DOutputDir=$PWD\out" deploy/windows/couchside.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem out
      # After the build, before upload: release.yml hashes what's uploaded.
      - name: sign the installer
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0.5.11
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: verify installer signature
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem out/*.exe)
          if ($exe.Count -ne 1) { throw "expected one installer in out/, found $($exe.Count)" }
          $sig = Get-AuthenticodeSignature $exe[0].FullName
          if ($sig.Status -ne 'Valid') { throw "$($exe[0].Name) signature is $($sig.Status): $($sig.StatusMessage)" }
          if (-not $sig.TimeStamperCertificate) { throw "$($exe[0].Name) signature has no timestamp" }
          Write-Host "$($exe[0].Name) signed by $($sig.SignerCertificate.Subject)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer
          path: out/*.exe
          retention-days: 14
